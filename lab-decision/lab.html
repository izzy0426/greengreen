<style>/* 실험실 '장관님, 결재해 주세요!' — 배출권 길라잡이 최종 토큰 */
:root {
  --paper: #f7faf7; --surface: #fff; --tint: #f1f7f2; --soft: #e8f4ec; --soft-2: #d2eadb;
  --line: #e0e9e3; --ink: #1b2a22; --muted: #61736a;
  --green: #3a6b57; --green-2: #6f9584; --leaf: #a6d8b8; --inverse: #2a4a3e;
  --sun: #f2c85a; --amber: #c27d22; --amber-ink: #8a5212; --amber-soft: #fbf0dc;
  --c-orange: #d9822b; --c-blue: #3f6fb5; --red: #c4553f; --c-gray: #aeb9c0;
  --font: 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --hdr: 64px; --r-card: 18px; --r-pill: 99px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.65 var(--font); word-break: keep-all; overflow-wrap: anywhere; -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
img.px { image-rendering: pixelated; display: block; }

/* 헤더 — 사이트와 같게 */
.hdr { position: sticky; top: 0; z-index: 30; height: var(--hdr); background: var(--surface); border-bottom: 1px solid var(--line); }
.hdr__in { position: relative; max-width: 1440px; height: 100%; margin: 0 auto; padding: 0 120px; display: flex; align-items: center; }
.logo { display: inline-flex; align-items: center; gap: 9px; color: var(--ink); text-decoration: none; font: 900 18px/1.2 var(--font); letter-spacing: -0.03em; }
.logo svg { flex: none; }
.tabs { position: absolute; left: 50%; top: 0; height: 100%; transform: translateX(-50%); display: flex; }
.tabs a { position: relative; display: flex; align-items: center; padding: 0 32px; color: var(--muted); text-decoration: none; font: 700 15.5px/1 var(--font); }
.tabs a::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--green); transform: scaleX(0); transition: transform .25s var(--ease); }
.tabs a:hover, .tabs a[aria-current] { color: var(--ink); }
.tabs a:hover::after, .tabs a[aria-current]::after { transform: scaleX(1); }

.wrap { max-width: 1440px; margin: 0 auto; padding: 24px 24px 40px; }
.screen[hidden] { display: none !important; }

/* 공통 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: var(--r-pill); padding: 12px 22px; font: 700 15px/1.4 var(--font); cursor: pointer; text-decoration: none; white-space: nowrap; transition: filter .15s, transform .15s; }
.btn--sun { background: var(--sun); color: #1b1608; }
.btn--green { background: var(--green); color: #fff; }
.btn--ghost { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(1px); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); }
.tag { display: inline-flex; align-items: center; border-radius: 6px; padding: 3px 9px; font: 800 12px/1.4 var(--font); color: #fff; background: var(--red); white-space: nowrap; }
.tag--pre { background: var(--amber-soft); color: var(--amber-ink); }
.tag--ref { background: var(--tint); color: var(--muted); }
.assume { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 4px; background: var(--amber-soft); color: var(--amber-ink); font: 700 11px/1.5 var(--font); vertical-align: 2px; }
.note { font-size: 12px; color: var(--muted); }

/* 비서 말풍선 */
.talk { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; align-items: center; }
.talk__face { width: 88px; height: 88px; border-radius: 16px; overflow: hidden; background: var(--soft); }
.talk__face img { width: 100%; height: 100%; object-fit: cover; }
.bubble { position: relative; background: var(--surface); border: 1.5px solid var(--green-2); border-radius: var(--r-card); padding: 14px 18px; }
.bubble::before { content: ''; position: absolute; left: -9px; top: 50%; width: 14px; height: 14px; background: var(--surface); border-left: 1.5px solid var(--green-2); border-bottom: 1.5px solid var(--green-2); transform: translateY(-50%) rotate(45deg); }
.bubble b { display: block; font: 800 12.5px/1.4 var(--font); color: var(--green); margin-bottom: 4px; }
.bubble p { font-size: 15.5px; line-height: 1.6; }

/* ① 시작 */
.intro { position: relative; border-radius: 22px; overflow: hidden; min-height: 560px; height: calc(100svh - var(--hdr) - 64px); max-height: 820px; background: var(--soft); }
.intro > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.intro__card { position: absolute; left: 32px; top: 32px; max-width: 560px; background: var(--surface); border-radius: var(--r-card); padding: 26px 28px; box-shadow: 0 10px 30px -14px rgb(20 50 35 / .35); }
.intro__card h1 { font: 900 40px/1.25 var(--font); letter-spacing: -0.02em; color: var(--green); }
.intro__card p { margin-top: 8px; color: var(--muted); }
.intro__card .btn { margin-top: 18px; }
.intro .talk { position: absolute; left: 32px; right: 32px; bottom: 28px; max-width: 1020px; }
.intro .talk__face { box-shadow: 0 6px 18px -8px rgb(0 0 0 / .4); }

/* 위쪽 숫자 4칸 */
.stats { display: grid; grid-template-columns: 0.7fr 1.3fr 1.3fr 1fr; background: var(--surface); border: 1px solid var(--line); border-top: 2px solid var(--ink); border-radius: 0 0 var(--r-card) var(--r-card); }
.stats > div { padding: 14px 22px 14px; border-right: 1px solid var(--line); min-width: 0; }
.stats > div:last-child { border-right: 0; }
.stats .k { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.stats .v { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.stats b { font: 900 24px/1.25 var(--font); font-variant-numeric: tabular-nums; }
.stats b.up { color: var(--red); }
.stats b.down { color: var(--green); }
.stats small { font-size: 12.5px; color: var(--muted); }
.stats .flash { animation: flash 1s var(--ease); }
@keyframes flash { 0% { background: var(--sun); } 100% { background: transparent; } }

/* 결재 화면 */
.desk { display: grid; grid-template-columns: minmax(0, 620fr) minmax(0, 748fr); gap: 24px; margin-top: 24px; align-items: start; }
.doc { padding: 26px 28px 22px; position: relative; }
.doc__meta { font-size: 13px; color: var(--muted); }
.doc__head { display: flex; justify-content: space-between; gap: 16px; margin-top: 8px; }
.doc h2 { font: 900 28px/1.35 var(--font); letter-spacing: -0.02em; }
.sign { display: grid; grid-template-columns: repeat(4, 60px); gap: 4px; flex: none; }
.sign > div { border: 1.5px solid var(--ink); border-radius: 6px; height: 68px; display: flex; flex-direction: column; align-items: center; padding-top: 3px; background: var(--surface); }
.sign > div.wait { border-style: dashed; border-color: var(--muted); }
.sign span { font-size: 11px; color: var(--muted); }
.seal { width: 38px; height: 38px; margin-top: 4px; border-radius: 50%; border: 2px solid var(--red); color: var(--red); display: grid; place-items: center; font: 800 11.5px/1 var(--font); }
.seal--me { background: rgb(196 85 63 / .08); animation: stamp .45s cubic-bezier(.2, 1.5, .45, 1) both; }
@keyframes stamp { from { transform: scale(2.4) rotate(-25deg); opacity: 0; } to { transform: none; opacity: 1; } }
.doc__desc { margin-top: 18px; font-size: 15px; }
.opts { list-style: none; margin: 22px 0 0; padding: 0; display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; padding: 14px 18px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--green-2); }
.opt[aria-checked='true'] { border-color: var(--green); background: var(--soft); }
.opt[aria-disabled='true'] { cursor: default; }
.opt__dot { width: 20px; height: 20px; margin-top: 2px; border-radius: 50%; border: 2px solid var(--green-2); display: grid; place-items: center; }
.opt[aria-checked='true'] .opt__dot::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.opt b { display: block; font: 800 16px/1.45 var(--font); }
.opt b em { font-style: normal; font-size: 12px; font-weight: 700; color: var(--green); background: var(--surface); border: 1px solid var(--soft-2); border-radius: var(--r-pill); padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
.opt small { display: block; margin-top: 2px; font-size: 13.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt[aria-checked='true'] small { color: var(--green); font-weight: 700; }
.doc__act { margin-top: 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.doc__src { margin-top: 18px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 12px; color: var(--muted); }
.bigstamp { position: absolute; right: 40px; top: 230px; width: 170px; height: 170px; border: 5px solid var(--red); border-radius: 50%; color: var(--red); display: grid; place-content: center; text-align: center; transform: rotate(-12deg); pointer-events: none; opacity: .85; animation: stamp .5s cubic-bezier(.2, 1.5, .45, 1) both; }
.bigstamp b { font: 900 44px/1 var(--font); }
.bigstamp small { font: 700 13px/1.4 var(--font); margin-top: 6px; }

.side { display: grid; gap: 14px; }
.scene { position: relative; border-radius: var(--r-card); overflow: hidden; aspect-ratio: 1376 / 768; background: var(--soft); border: 1px solid var(--line); }
.scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity .5s ease; }
.scene__label { position: absolute; left: 12px; top: 12px; z-index: 2; background: var(--surface); border-radius: 8px; padding: 5px 10px; font: 800 12.5px/1.3 var(--font); box-shadow: 0 2px 8px rgb(0 0 0 / .12); }
.scene__label.is-news { background: var(--red); color: #fff; }
.news { display: flex; gap: 12px; align-items: center; padding: 14px 18px; }
.news p { font: 700 15.5px/1.5 var(--font); }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.chip { display: flex; align-items: center; gap: 8px; padding: 12px 14px; }
.chip i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip b { font: 800 14px/1.3 var(--font); white-space: nowrap; }
.chip span { font-size: 13px; color: var(--muted); }
.dot-green { background: var(--green); } .dot-red { background: var(--red); } .dot-amber { background: var(--sun); } .dot-gray { background: var(--c-gray); }

/* ⑦ 성적표 */
.report { display: grid; grid-template-columns: minmax(0, 420fr) minmax(0, 948fr); gap: 24px; margin-top: 24px; align-items: start; }
.story { overflow: hidden; }
.story__img { aspect-ratio: 1376 / 768; }
.story__img img { width: 100%; height: 100%; object-fit: cover; }
.story__body { padding: 20px 20px 22px; }
.story h2 { font: 800 16px/1.4 var(--font); }
.story .k { margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.events { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.events li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; align-items: center; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.events img { width: 120px; height: 68px; object-fit: cover; }
.events b { display: block; font: 800 12.5px/1.4 var(--font); color: var(--green); }
.events span { font-size: 14px; }
.story .talk { margin-top: 18px; grid-template-columns: 64px minmax(0, 1fr); }
.story .talk__face { width: 64px; height: 64px; }
.story .bubble p { font-size: 14px; }
.sheet { padding: 34px 40px 26px; position: relative; }
.sheet h1 { font: 900 34px/1.3 var(--font); letter-spacing: -0.02em; }
.sheet__sub { margin-top: 4px; color: var(--muted); }
.sheet__sub b { color: var(--green); }
.done { position: absolute; right: 40px; top: 34px; border: 3px solid var(--red); color: var(--red); border-radius: 10px; padding: 6px 16px; font: 900 20px/1.2 var(--font); transform: rotate(-8deg); }
.rows { list-style: none; margin: 22px 0 0; padding: 0; border-top: 1px solid var(--line); }
.rows li { display: grid; grid-template-columns: 170px minmax(0, 1fr) 64px; gap: 20px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
.rows .nm { display: flex; align-items: center; gap: 12px; font: 800 18px/1.3 var(--font); }
.rows .nm i { width: 36px; height: 36px; border-radius: 8px; flex: none; }
.rows .lab { font-size: 12.5px; color: var(--muted); }
.rows .val { font: 900 26px/1.3 var(--font); font-variant-numeric: tabular-nums; }
.rows .cmp { font-size: 13px; color: var(--muted); }
.grade { width: 60px; height: 60px; border-radius: 12px; border: 2.5px solid; display: grid; place-items: center; font: 900 30px/1 var(--font); }
.g-A { color: var(--green); border-color: var(--green); }
.g-B { color: var(--c-blue); border-color: var(--c-blue); }
.g-C { color: var(--amber-ink); border-color: var(--amber); }
.g-na { color: var(--muted); border-color: var(--line); font-size: 13px; }
.total { margin-top: 22px; padding-top: 18px; border-top: 2px dashed var(--ink); display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.total .k { font-size: 12.5px; color: var(--muted); }
.total b { font: 900 24px/1.4 var(--font); font-variant-numeric: tabular-nums; }
.total .real b { color: var(--muted); }
.acts { margin-top: 22px; display: flex; gap: 10px; flex-wrap: wrap; }
.legend-g { margin-top: 18px; font-size: 12px; color: var(--muted); line-height: 1.7; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--inverse); color: #fff; padding: 10px 18px; border-radius: var(--r-pill); font-weight: 700; font-size: 14px; z-index: 50; }

.foot { max-width: 1440px; margin: 0 auto; padding: 0 24px 32px; font-size: 12.5px; color: var(--muted); }

/* 반응형 */
@media (max-width: 1279px) {
  .hdr__in { padding: 0 40px; }
  .desk, .report { grid-template-columns: minmax(0, 1fr); }
  .report .sheet { order: -1; }
  .story__img { max-height: 300px; aspect-ratio: auto; height: 300px; }
  .bigstamp { top: 180px; }
}
@media (max-width: 1023px) {
  .tabs { position: static; transform: none; margin-left: auto; }
  .tabs a { padding: 0 16px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats > div:nth-child(2) { border-right: 0; }
  .stats > div:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
}
@media (max-width: 767px) {
  .hdr__in { padding: 0 16px; }
  .logo span { display: none; }
  .tabs a { padding: 0 12px; font-size: 14.5px; }
  .wrap { padding: 14px 12px 32px; }
  .intro { height: auto; min-height: 0; max-height: none; display: flex; flex-direction: column; }
  .intro > img { position: static; aspect-ratio: 1376 / 768; height: auto; }
  .intro__card { position: static; max-width: none; border-radius: 0; box-shadow: none; padding: 20px; }
  .intro__card h1 { font-size: 28px; }
  .intro .talk { position: static; padding: 0 16px 20px; }
  .talk { grid-template-columns: 56px minmax(0, 1fr); gap: 12px; }
  .talk__face { width: 56px; height: 56px; }
  .bubble p { font-size: 14px; }
  .stats > div { padding: 10px 14px; }
  .stats b { font-size: 20px; }
  .doc { padding: 20px 16px; }
  .doc__head { flex-direction: column; }
  .doc h2 { font-size: 23px; }
  .sign { grid-template-columns: repeat(4, 52px); align-self: flex-end; }
  .sign > div { height: 60px; }
  .seal { width: 32px; height: 32px; font-size: 10.5px; }
  .opt { padding: 12px 14px; }
  .opt b { font-size: 15px; }
  .chips { grid-template-columns: minmax(0, 1fr); }
  .bigstamp { width: 120px; height: 120px; right: 16px; top: 230px; }
  .bigstamp b { font-size: 32px; }
  .sheet { padding: 22px 16px; }
  .sheet h1 { font-size: 26px; }
  .done { position: static; display: inline-block; margin-bottom: 10px; font-size: 16px; }
  .rows li { grid-template-columns: minmax(0, 1fr) 52px; gap: 6px 12px; }
  .rows .nm { grid-column: 1 / -1; font-size: 16px; }
  .rows .nm i { width: 22px; height: 22px; border-radius: 6px; }
  .rows .val { font-size: 21px; }
  .grade { width: 50px; height: 50px; font-size: 24px; grid-column: 2; grid-row: 2; }
  .total { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .events li { grid-template-columns: 96px minmax(0, 1fr); }
  .events img { width: 96px; height: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

  }

  var base = DATA.combos[DATA.base]
  var cur = function () { return st.pick.map(function (v, i) { return v == null ? BASE_PICK[i] : v }) }
  var nf = function (v, d) { return Number(v).toLocaleString('ko-KR', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }) }
  var jo = function (won, d) { return nf(won / 1e12, d == null ? 1 : d) + '조' }
  var mt = function (t) { return nf(t / 1e6, 1) + '백만 t' }
  var pct = function (x) { var v = Math.round(x * 1000) / 10; return (v > 0 ? '+' : v < 0 ? '−' : '') + nf(Math.abs(v), 1) + '%' }
  var gon = function (n) { return nf(n) + '곳' }
  var won = function (v) { return nf(Math.round(v)) + '원' }
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c] }) }

  function ctx(p, from) {
    var c = combo(p), f = combo(from)
    var carry = [0, 1, 2].map(function (k) { var q = p.slice(); q[2] = k; return combo(q).cost5y })
    var spread = Math.ceil((Math.max.apply(null, carry) - Math.min.apply(null, carry)) / 1e11) / 10
    return {
      cost: jo(c.cost5y), cost2: jo(c.cost5y, 2), costFrom: jo(f.cost5y), turn: gon(c.turnLoss2030), turnFrom: gon(f.turnLoss2030),
      emis: mt(c.emis2030), meter: pct(c.meter), meterAbs: nf(Math.abs(c.meter) * 100, 1) + '%', spread: nf(spread, 1) + '조',
    }
  }
  var fill = function (s, x) { return s.replace(/\{(\w+)\}/g, function (_, k) { return x[k] != null ? x[k] : '' }) }

  function optLine(d, i) {
    var p = cur(); p[st.step] = i
    var c = combo(p)
    var t = D[d].options[i].line
    if (t === 'cost-turn') return '5년 비용 ' + jo(c.cost5y) + ' · 적자 ' + gon(c.turnLoss2030)
    if (t === 'emis') return '2030 배출 ' + mt(c.emis2030) + ' · 총량 대비 ' + pct(c.meter) + ' · 5년 ' + jo(c.cost5y)
    return '5년 비용 ' + jo(c.cost5y, 2)
  }

  // ── 그림 ──
  function img(name, alt, cls) {
    var src = IMG[name]
    if (!src) {
      var label = { office: '집무실', business: '경제단체 항의', climate: '시민단체 시위', household: '가계 전기요금', secretary: '비서', good: '좋은 결과', s2: '배출 장면 S2' }[name] || name
      src = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 384"><rect width="688" height="384" fill="#e8f4ec"/><text x="344" y="200" font-family="sans-serif" font-size="28" fill="#61736a" text-anchor="middle">그림 자리 · ' + label + '</text></svg>')
    }
    return '<img class="px ' + (cls || '') + '" src="' + src + '" alt="' + esc(alt || '') + '">'
  }
  function talk(text, mini) {
    return '<div class="talk' + (mini ? ' talk--mini' : '') + '"><div class="talk__face">' + img('secretary', '김주무관') + '</div>' +
      '<div class="bubble" role="status"><b>김주무관</b><p>' + esc(text) + '</p></div></div>'
  }

  // ── 위쪽 숫자 ──
  function stats(flash) {
    var p = cur(), c = combo(p), any = st.pick.some(function (v) { return v != null })
    var cmp = function (v, b, f) { return !any ? '원안' : v === b ? '원안 그대로' : '원안 ' + f(b) }
    var cls = function (v, b) { return v > b ? 'up' : v < b ? 'down' : '' }
    var doneN = st.pick.filter(function (v) { return v != null }).length
    var step = st.screen === 'report' ? '완료' : (st.step + 1) + ' / 3' + (st.decided ? ' 완료' : '')
    return '<div class="stats' + (flash ? ' flashing' : '') + '" aria-live="polite">' +
      '<div><div class="k">결재</div><div class="v"><b>' + step + '</b><small>' + doneN + '건 결재함</small></div></div>' +
      '<div' + (flash ? ' class="flash"' : '') + '><div class="k">2030 배출 · 4차 총량 대비</div><div class="v"><b class="' + cls(c.meter, 0) + '">' + pct(c.meter) + '</b><small>' + cmp(c.meter, base.meter, pct) + '</small></div></div>' +
      '<div' + (flash ? ' class="flash"' : '') + '><div class="k">5년 탄소비용</div><div class="v"><b class="' + cls(c.cost5y, base.cost5y) + '">' + jo(c.cost5y) + ' 원</b><small>' + cmp(c.cost5y, base.cost5y, function (v) { return jo(v) }) + '</small></div></div>' +
      '<div' + (flash ? ' class="flash"' : '') + '><div class="k">적자로 돌아서는 곳 (2030년)</div><div class="v"><b class="' + cls(c.turnLoss2030, base.turnLoss2030) + '">' + gon(c.turnLoss2030) + '</b><small>' + cmp(c.turnLoss2030, base.turnLoss2030, gon) + '</small></div></div>' +
      '</div>'
  }

  // ── ① 시작 ──
  function renderIntro() {
    app.innerHTML = '<section class="intro" aria-labelledby="intro-h">' + img('office', '장관 집무실. 서류 더미 뒤에 장관이 앉아 있고 비서가 서류를 들고 들어온다') +
      '<div class="intro__card"><h1 id="intro-h">' + esc(C.intro.title) + '</h1><p>' + esc(C.intro.sub) + '</p>' +
      '<button class="btn btn--sun" id="start">집무 시작</button></div>' + talk(C.intro.say) + '</section>'
    $('#start').addEventListener('click', function () { st.screen = 'decide'; render(); focusOpts() })
  }

  // ── 결재 ──
  function renderDecide(flash) {
    var d = D[st.step], i = st.sel[st.step], r = d.react[i]
    var from = cur()
    var p = cur(); p[st.step] = i
    var x = ctx(p, from)
    if (st.decided) x = ctx(cur(), (function () { var q = cur(); q[st.step] = BASE_PICK[st.step]; return q })())
    var opts = d.options.map(function (o, k) {
      return '<li class="opt" role="radio" tabindex="' + (k === i ? 0 : -1) + '" aria-checked="' + (k === i) + '"' + (st.decided ? ' aria-disabled="true"' : '') + ' data-k="' + k + '">' +
        '<span class="opt__dot" aria-hidden="true"></span><span><b>가안 ' + '①②③④'[k] + ' ' + esc(o.label) + (o.base ? '<em>원안</em>' : '') + '</b><small>' + optLine(st.step, k) + '</small></span></li>'
    }).join('')
    var seals = ['담당', '과장', '국장'].map(function (n) { return '<div><span>' + n + '</span><i class="seal" aria-hidden="true">인</i></div>' }).join('') +
      (st.decided ? '<div><span>장관</span><i class="seal seal--me">결재</i></div>' : '<div class="wait"><span>장관</span><span class="sr">결재 전</span></div>')
    var news = st.decided ? fill(r.news, x) : fill(r.preview, x)
    var label = st.decided ? '속보 · 결재 ' + (st.step + 1) + ' 직후' : '미리 보기 · 가안 ' + '①②③④'[i] + ['을', '를', '을', '를'][i] + ' 결재하면'
    var tag = r.tag ? '<span class="tag tag--ref">' + r.tag + '</span>' : st.decided ? '<span class="tag">속보</span>' : '<span class="tag tag--pre">예상</span>'
    var last = st.step === 2
    app.innerHTML = stats(flash) +
      '<div class="desk">' +
      '<article class="doc card" aria-labelledby="doc-h">' +
      '<p class="doc__meta">기후에너지정책과 · 결재 ' + d.no + '</p>' +
      '<div class="doc__head"><h2 id="doc-h">' + d.title.map(esc).join('<br>') + '</h2><div class="sign" aria-label="결재란">' + seals + '</div></div>' +
      '<p class="doc__desc">' + esc(d.desc) + '</p>' +
      '<ul class="opts" role="radiogroup" aria-labelledby="doc-h">' + opts + '</ul>' +
      '<div class="doc__act">' + (st.decided
        ? '<button class="btn btn--green" id="next">' + (last ? '임기 성적표 받기' : '다음 결재안 받기') + ' →</button>'
        : '<button class="btn btn--sun" id="sign">가안 ' + '①②③④'[i] + ['으로', '로', '으로', '로'][i] + ' 결재</button><span class="note">방향키로 고르고 Enter로 결재</span>') + '</div>' +
      '<p class="doc__src">' + esc(d.src) + '</p>' +
      (st.decided ? '<div class="bigstamp" aria-hidden="true"><b>결재</b><small>기후에너지부 장관</small></div>' : '') +
      '</article>' +
      '<div class="side">' +
      '<div class="scene"><span class="scene__label' + (st.decided ? ' is-news' : '') + '">' + label + '</span>' + img(r.img, r.event) + '</div>' +
      '<div class="news card">' + tag + '<p>' + esc(news) + '</p></div>' +
      '<div class="chips">' + r.chips.map(function (c) { return '<div class="chip card"><i class="dot-' + c[2] + '" aria-hidden="true"></i><b>' + esc(c[0]) + '</b><span>' + esc(c[1]) + '</span></div>' }).join('') + '</div>' +
      '<p class="note">' + (r.note ? esc(r.note) + ' ' : '') + '장면과 뉴스 문구는 연출이에요. 숫자만 엔진 결과예요.</p>' +
      talk(st.decided ? r.say : d.ask) +
      '</div></div>'
    bindDecide()
  }

  function choose(k) {
    if (st.decided) return
    st.sel[st.step] = k
    renderDecide()
    var el = app.querySelector('.opt[data-k="' + k + '"]'); if (el) el.focus()
  }
  function sign() {
    if (st.decided) return
    st.pick[st.step] = st.sel[st.step]
    st.decided = true
    renderDecide(!REDUCED)
    var b = $('#next'); if (b) b.focus()
  }
  function next() {
    if (st.step < 2) { st.step++; st.decided = false; render(); focusOpts() }
    else { st.screen = 'report'; location.hash = 'r=' + key(cur()); render() }
    window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' })
  }
  function focusOpts() { var el = app.querySelector('.opt[tabindex="0"]'); if (el) el.focus({ preventScroll: true }) }
  function bindDecide() {
    app.querySelectorAll('.opt').forEach(function (el) {
      el.addEventListener('click', function () { choose(+el.dataset.k) })
      el.addEventListener('keydown', function (e) {
        var n = D[st.step].options.length, k = +el.dataset.k
        if (e.key === 'ArrowDown' || e.key === 'ArrowRight') { e.preventDefault(); choose((k + 1) % n) }
        else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') { e.preventDefault(); choose((k - 1 + n) % n) }
        else if (e.key === 'Enter') { e.preventDefault(); if (st.decided) next(); else { if (k !== st.sel[st.step]) choose(k); sign() } }
        else if (e.key === ' ') { e.preventDefault(); choose(k) }
      })
    })
    var s = $('#sign'); if (s) s.addEventListener('click', sign)
    var nx = $('#next'); if (nx) nx.addEventListener('click', next)
  }

  // ── ⑦ 성적표 ── 등급 기준은 decisions.md L1~L4
  function grades(c) {
    return {
      reduce: c.meter <= 0 ? 'A' : c.meter <= 0.05 ? 'B' : 'C',
      industry: c.turnLoss2030 < base.turnLoss2030 ? 'A' : c.turnLoss2030 <= base.turnLoss2030 * 2 ? 'B' : 'C',
      power: c.powerCost2030 <= base.powerCost2030 ? 'A' : c.powerCost2030 <= base.powerCost2030 * 2 ? 'B' : 'C',
      signal: c.effPrice2030 >= 15000 ? 'A' : c.effPrice2030 >= 5000 ? 'B' : 'C',
    }
  }
  function renderReport() {
    var p = cur(), c = combo(p), g = grades(c)
    var end = C.report.endings.filter(function (e) { return e.when(g) })[0].name
    var events = [0, 1, 2].map(function (k) {
      var r = D[k].react[p[k]]
      return '<li>' + img(r.img, r.event) + '<div><b>결재 ' + (k + 1) + ' 뒤</b><span>' + esc(r.event) + '</span></div></li>'
    }).join('')
    var cap = c.cap2030
    var gap = c.emis2030 - cap
    var row = function (color, name, lab, val, cmp, gr, extra) {
      return '<li><div class="nm"><i style="background:' + color + '" aria-hidden="true"></i>' + name + '</div>' +
        '<div><div class="lab">' + lab + extra + '</div><div class="val">' + val + '</div><div class="cmp">' + cmp + '</div></div>' +
        '<div class="grade g-' + gr + '" aria-label="등급 ' + gr + '">' + gr + '</div></li>'
    }
    app.innerHTML = stats() +
      '<div class="report">' +
      '<aside class="story card"><div class="story__img">' + img(g.reduce === 'A' ? 'good' : 'climate', g.reduce === 'A' ? '맑은 하늘 아래 풍력·태양광과 축제 분위기의 마을' : '광장에 모인 기후 행진') + '</div>' +
      '<div class="story__body"><h2>2030년, 장관님 임기 마지막 해</h2><p class="k">임기 동안 있었던 일</p><ul class="events">' + events + '</ul>' +
      '<p class="note" style="margin-top:8px">장면은 연출이에요.</p>' + talk(C.report.say) + '</div></aside>' +
      '<section class="sheet card" aria-labelledby="rep-h">' +
      '<h1 id="rep-h">장관 임기 성적표</h1><span class="done" aria-hidden="true">임기 종료</span>' +
      '<p class="sheet__sub">4차 배출권거래제 2026–2030 · 결말: <b>' + esc(end) + '</b></p>' +
      '<ul class="rows">' +
      row('var(--green)', '감축', '2030년 배출', mt(c.emis2030), '4차 총량 ' + mt(cap) + (gap <= 0 ? ' 안' : '보다 ' + mt(gap) + ' 많음'), g.reduce, '') +
      row('#8a857a', '산업', '적자로 돌아서는 곳 (2030년)', gon(c.turnLoss2030), '실제 4차 계획 ' + gon(base.turnLoss2030), g.industry, '') +
      row('#e0b33a', '전기요금', '발전 부문 2030년 탄소비용', jo(c.powerCost2030) + ' 원', '실제 4차 계획 ' + jo(base.powerCost2030) + ' 원 · 가구당 월 부담은 전가율 분석 전이라 확인 필요', g.power, '<span class="assume">가정</span>') +
      row('#7c5cc4', '감축 신호', '배출 1톤당 실제 부담 (2030년)', won(c.effPrice2030), '시장 가격(' + won(c.price2030) + ')의 ' + nf(c.effPrice2030 / c.price2030 * 100) + '% · 실제 4차 계획 ' + won(base.effPrice2030), g.signal, '') +
      '</ul>' +
      '<div class="total"><div><div class="k">5년 탄소비용</div><b>내 계획 ' + jo(c.cost5y) + ' 원</b></div><div class="real"><div class="k">&nbsp;</div><b>실제 4차 계획 ' + jo(base.cost5y) + ' 원</b></div></div>' +
      '<div class="acts"><button class="btn btn--sun" id="again">다시 결재하기</button><button class="btn btn--ghost" id="share">결과 공유하기</button><a class="btn btn--ghost" href="#company">우리 회사 청구서 보기</a></div>' +
      '<p class="legend-g">등급 기준 · 감축: 2030 배출이 4차 총량 안이면 A, 5% 이내 초과 B, 그 이상 C · 산업: 적자 전환이 실제 4차 계획보다 적으면 A, 2배 이하 B, 그 이상 C · ' +
      '전기요금: 발전 부문 2030 탄소비용이 실제 4차 계획 이하 A, 2배 이하 B, 그 이상 C · 감축 신호: 1톤당 실제 부담 1만 5천 원 이상 A, 5천 원 이상 B, 미만 C. ' +
      '실제 4차 계획 = 4차 할당계획 + 3만 원 + 예측대로 + 지금 이월 규칙(모든 결재 원안). 숫자: 팀 계산엔진(2026.11.18) 조합 ' + key(p) + '. 등급과 결말은 팀이 정하지 않아 임시 기준.</p>' +
      '</section></div>'
    $('#again').addEventListener('click', function () { history.replaceState(null, '', location.pathname + location.search); reset(); render(); window.scrollTo(0, 0) })
    $('#share').addEventListener('click', share)
  }
  function share() {
    var url = location.href.split('#')[0] + '#r=' + key(cur())
    var done = function () { toast('결과 주소를 복사했어요') }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, function () { fallback(url) })
    else fallback(url)
  }
  function fallback(url) {
    var t = document.createElement('textarea'); t.value = url; document.body.appendChild(t); t.select()
    try { document.execCommand('copy'); toast('결과 주소를 복사했어요') } catch (e) { toast(url) }
    t.remove()
  }
  function toast(msg) {
    var t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg
    document.body.appendChild(t); setTimeout(function () { t.remove() }, 2200)
  }

  function render() {
    if (st.screen === 'intro') renderIntro()
    else if (st.screen === 'decide') renderDecide()
    else renderReport()
  }
  function fromHash() {
    var m = /^#r=([1-4])([1-3])([1-3])$/.exec(location.hash)
    if (!m) return false
    st.pick = [+m[1] - 1, +m[2] - 1, +m[3] - 1]; st.sel = st.pick.slice(); st.screen = 'report'; st.step = 2; st.decided = true
    return true
  }
  reset(); fromHash(); render()
  window.addEventListener('hashchange', function () { if (fromHash()) render() })
})()
</script>
</body>
</html>
